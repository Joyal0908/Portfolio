{% extends "base.html" %}

{% block title %}Edit Project{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Edit Project</h2>

    <form method="POST" action="{{ url_for('project_update', id=project.id) }}">

        <!-- Title -->
        <div class="form-group mb-3">
            <label for="title">Title</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ project.project_title }}"
                required>
        </div>

        <!-- Description -->
        <div class="form-group mb-3">
            <label for="description">Description</label>
            <textarea class="form-control" id="description" name="description" rows="4"
                required>{{ project.description }}</textarea>
        </div>

        <!-- Link -->
        <div class="form-group mb-3">
            <label for="link">Link</label>
            <input type="url" class="form-control" id="link" name="link" value="{{ project.link }}" required>
        </div>

        <!-- Client Name -->
        <div class="form-group">
            <label>Client Name:</label>
            <input type="text" name="client_name" class="form-control" value="{{ project.client_name }}" required>
        </div>

        <!-- Status -->
        <div class="form-group">
            <label>Status:</label>
            <select name="status" class="form-control" value="{{ project.status }}" required>
                <option value="ongoing" selected>Ongoing</option>
                <option value="completed">Completed</option>
            </select>
        </div>

        <!-- Buttons -->
        <button type="submit" class="btn btn-success">Update Project</button>
        <a href="{{ url_for('admin') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}

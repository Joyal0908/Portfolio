{% extends "base.html" %}

{% block title %} Edit Skill {% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Edit Skill</h2>

    <form method="POST" action="{{ url_for('edit_skill', skill_id=skill.id) }}">
        <!-- Category -->
        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" id="category" name="category" required>
                <option value="">Select Category</option>
                <option value="frontend" {% if skill.category == 'frontend' %}selected{% endif %}>Frontend</option>
                <option value="backend" {% if skill.category == 'backend' %}selected{% endif %}>Backend</option>
                <option value="database" {% if skill.category == 'database' %}selected{% endif %}>Database</option>
            </select>
        </div>

        <!-- Skill Name -->
        <div class="mb-3">
            <label for="name" class="form-label">Skill Name</label>
            <input type="text" class="form-control" id="name" name="name"
                   value="{{ skill.name }}" required>
        </div>

        <!-- Icon Class -->
        <div class="mb-3">
            <label for="icon_class" class="form-label">Font Awesome Icon Class</label>
            <input type="text" class="form-control" id="icon_class" name="icon_class"
                   value="{{ skill.icon_class }}" required>
            <small class="form-text text-muted">Use Font Awesome icon class for skill icons.</small>
        </div>

        <!-- Description -->
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" required>{{ skill.description }}</textarea>
        </div>

        <!-- Proficiency Level -->
        <div class="mb-3">
            <label for="proficiency_level" class="form-label">Proficiency Level</label>
            <select class="form-select" id="proficiency_level" name="proficiency_level" required>
                <option value="">Select Level</option>
                <option value="Beginner" {% if skill.proficiency_level == 'Beginner' %}selected{% endif %}>Beginner</option>
                <option value="Intermediate" {% if skill.proficiency_level == 'Intermediate' %}selected{% endif %}>Intermediate</option>
                <option value="Advanced" {% if skill.proficiency_level == 'Advanced' %}selected{% endif %}>Advanced</option>
                <option value="Proficient" {% if skill.proficiency_level == 'Proficient' %}selected{% endif %}>Proficient</option>
            </select>
        </div>

        <!-- Proficiency Percent -->
        <div class="mb-3">
            <label for="proficiency_percent" class="form-label">Proficiency Percent</label>
            <input type="number" class="form-control" id="proficiency_percent" name="proficiency_percent" min="0" max="100"
                   value="{{ skill.proficiency_percent }}" required>
        </div>

        <!-- Buttons -->
        <button type="submit" class="btn btn-success">Update Skill</button>
        <a href="{{ url_for('admin') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
